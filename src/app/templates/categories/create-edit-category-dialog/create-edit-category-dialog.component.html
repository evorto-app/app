@if (data.mode === "create") {
  <h1 mat-dialog-title>Create a new category</h1>
} @else {
  <h1 mat-dialog-title>Edit category</h1>
}
<form (submit)="onSubmit($event)">
  <mat-dialog-content>
    @if (saveMessage()) {
      <div role="alert" class="body-medium mb-4">
        <p>{{ saveMessage() }}</p>
      </div>
    }
    @if (saving()) {
      <p role="status" class="body-medium">
        Saving category and updating the list…
      </p>
    }
    <div class="mt-4 flex flex-col gap-4">
      <app-icon-selector-field
        [formField]="categoryForm.icon"
        [usage]="iconUsage"
      />
      <mat-form-field class="w-full">
        <mat-label>Category title</mat-label>
        <input matInput type="text" [formField]="categoryForm.title" />
      </mat-form-field>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions align="end" class="gap-2">
    <button
      mat-button
      type="button"
      mat-dialog-close
      [disabled]="categoryForm().submitting()"
    >
      {{ saveConfirmed() ? "Close" : "Cancel" }}
    </button>
    @if (!saveConfirmed()) {
      <button
        mat-button
        type="submit"
        [disabled]="categoryForm().invalid() || categoryForm().submitting()"
      >
        {{ categoryForm().submitting() ? "Saving…" : "Save" }}
      </button>
    }
  </mat-dialog-actions>
</form>
