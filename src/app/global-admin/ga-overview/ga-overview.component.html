<app-two-column-layout [detailActive]="outletActive()">
  <div twoColumnHeader class="flex w-full flex-row items-center gap-2">
    <h1 class="title-large">Evorto administration</h1>
    <div class="grow"></div>
  </div>
  <nav twoColumnSidebar class="flex flex-col gap-4">
    <a
      routerLink="tenants"
      class="bg-surface text-on-surface rounded-2xl p-4"
      routerLinkActive="bg-secondary-container! text-on-secondary-container!"
    >
      <div class="flex flex-row items-center gap-4">
        <fa-duotone-icon [icon]="faFolders" size="xl" />
        <h2 class="title-medium">Organizations</h2>
      </div>
    </a>
    <a
      routerLink="email-outbox"
      class="bg-surface text-on-surface rounded-2xl p-4"
      routerLinkActive="bg-secondary-container! text-on-secondary-container!"
    >
      <div class="flex flex-row items-center gap-4">
        <fa-duotone-icon [icon]="faEnvelopeOpenText" size="xl" />
        <h2 class="title-medium">Email outbox</h2>
      </div>
    </a>
    <a
      routerLink="audit"
      class="bg-surface text-on-surface rounded-lg p-4"
      routerLinkActive="bg-secondary-container! text-on-secondary-container!"
    >
      <div class="flex flex-row items-center gap-4">
        <fa-duotone-icon [icon]="faClockRotateLeft" size="xl" />
        <h2 class="title-medium">Evorto change history</h2>
      </div>
    </a>
  </nav>
  <div twoColumnDetail>
    <router-outlet
      (activate)="outletActive.set(true)"
      (deactivate)="outletActive.set(false)"
    />
  </div>
</app-two-column-layout>
