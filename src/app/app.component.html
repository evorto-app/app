<div
  class="flex min-h-dvh flex-col lg:ml-22 lg:has-[app-event-list]:h-dvh lg:has-[app-event-list]:overflow-hidden lg:has-[app-template-list]:h-dvh lg:has-[app-template-list]:overflow-hidden"
>
  <div
    class="flex flex-1 flex-col lg:min-h-0 lg:pt-6 lg:has-[app-event-list]:pt-0 lg:has-[app-template-list]:pt-0"
  >
    <router-outlet />
  </div>
  @if (legalLinks().length > 0) {
    <footer
      class="text-on-surface-variant flex shrink-0 flex-wrap justify-center items-center gap-x-6 gap-y-2 px-4 pb-28 pt-3 text-sm lg:py-3"
    >
      @if (footerLinks().length) {
        <nav
          aria-label="Organization links"
          class="flex flex-wrap items-center gap-1"
        >
          @for (link of footerLinks(); track $index) {
            <a
              mat-icon-button
              [href]="link.href"
              [attr.aria-label]="link.label"
              [matTooltip]="link.label"
              [attr.target]="link.href.startsWith('mailto:') ? null : '_blank'"
              rel="noopener noreferrer"
            >
              <fa-duotone-icon [icon]="footerIcons[link.icon]" />
            </a>
          }
        </nav>
      }
      <nav
        aria-label="Legal information"
        class="flex flex-wrap items-center justify-center gap-x-4 gap-y-2"
      >
        @for (link of legalLinks(); track link.label) {
          <a
            class="underline-offset-4 hover:underline"
            [href]="link.href"
            [attr.target]="link.external ? '_blank' : null"
            [attr.rel]="link.external ? 'noopener noreferrer' : null"
          >
            {{ link.label }}
          </a>
        }
      </nav>
    </footer>
  }
</div>

<app-navigation />
