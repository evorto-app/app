<div class="flex min-h-dvh flex-col lg:ml-22 lg:pt-6">
  <div class="flex flex-1 flex-col">
    <router-outlet />
  </div>
  @if (legalLinks().length > 0) {
    <footer
      class="text-on-surface-variant flex shrink-0 flex-wrap justify-center gap-x-4 gap-y-2 px-4 pb-28 pt-8 text-sm lg:pb-6"
    >
      @for (link of legalLinks(); track link.label) {
        <a
          class="underline-offset-4 hover:underline"
          [href]="link.href"
          [attr.target]="link.external ? '_blank' : null"
          [attr.rel]="link.external ? 'noopener noreferrer' : null"
        >
          {{ link.label }}
        </a>
      }
    </footer>
  }
</div>

<app-navigation />
