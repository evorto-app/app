<app-two-column-layout [detailActive]="outletActive()">
  <div twoColumnHeader class="flex w-full flex-row items-center gap-2">
    <h1 class="title-large">Finances</h1>
    <div class="grow"></div>
  </div>
  <nav twoColumnSidebar class="flex flex-col gap-4">
    <a
      *appIfPermission="'finance:viewTransactions'"
      routerLink="transactions"
      class="bg-surface text-on-surface rounded-2xl p-4"
      routerLinkActive="bg-secondary-container! text-on-secondary-container!"
    >
      <div class="flex flex-row items-center gap-4">
        <fa-duotone-icon [icon]="faListTimeline" size="xl" />
        <h2 class="title-medium">Payment history</h2>
      </div>
    </a>
    <a
      *appIfPermission="'finance:approveReceipts'"
      routerLink="receipts-approval"
      class="bg-surface text-on-surface rounded-2xl p-4"
      routerLinkActive="bg-secondary-container! text-on-secondary-container!"
    >
      <div class="flex flex-row items-center gap-4">
        <fa-duotone-icon [icon]="faBadgeCheck" size="xl" />
        <h2 class="title-medium">Receipt approvals</h2>
      </div>
    </a>
    <a
      *appIfPermission="'finance:refundReceipts'"
      routerLink="receipts-refunds"
      class="bg-surface text-on-surface rounded-2xl p-4"
      routerLinkActive="bg-secondary-container! text-on-secondary-container!"
    >
      <div class="flex flex-row items-center gap-4">
        <fa-duotone-icon [icon]="faRotateExclamation" size="xl" />
        <h2 class="title-medium">Receipt reimbursements</h2>
      </div>
    </a>
  </nav>
  <div twoColumnDetail>
    <router-outlet
      (activate)="outletActive.set(true)"
      (deactivate)="outletActive.set(false)"
    />
  </div>
</app-two-column-layout>
