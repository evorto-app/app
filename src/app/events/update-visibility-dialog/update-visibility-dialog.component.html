<h2 mat-dialog-title>Update listing for {{ data.event.title }}</h2>
<mat-dialog-content>
  <div class="mt-2 grid w-full gap-3">
    <mat-form-field appearance="outline">
      <mat-label>Listing audience</mat-label>
      <mat-select [formField]="listingForm.listingAudience">
        @for (audience of eventListingAudiences; track audience) {
          <mat-option [value]="audience">
            {{ eventListingAudienceLabels[audience] }}
          </mat-option>
        }
      </mat-select>
    </mat-form-field>
    <p class="text-on-surface-variant body-medium">
      {{
        eventListingAudienceDescriptions[listingForm.listingAudience().value()]
      }}
    </p>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button
    mat-button
    [mat-dialog-close]="listingForm.listingAudience().value()"
    cdkFocusInitial
  >
    Save
  </button>
</mat-dialog-actions>
