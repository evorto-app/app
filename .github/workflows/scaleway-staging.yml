name: Deploy Scaleway staging

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full main SHA; empty selects the current main tip
        required: false
        type: string
      full_trace_debugging:
        description: Sample all application traces for this forward deployment
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows: [E2E Baseline]
    branches: [main]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: scaleway-staging-deployment
  cancel-in-progress: false

jobs:
  resolve-revision:
    name: Select current main revision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.revision.outputs.deploy }}
      revision: ${{ steps.revision.outputs.revision }}
    steps:
      - name: Resolve exact current main SHA
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_REVISION: ${{ inputs.revision }}
          WORKFLOW_RUN_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_revision="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          requested_revision="${REQUESTED_REVISION:-${WORKFLOW_RUN_REVISION:-${current_revision}}}"

          if [[ ! "${requested_revision}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The requested deployment revision is not a full Git SHA"
            exit 1
          fi

          echo "revision=${requested_revision}" >> "${GITHUB_OUTPUT}"
          if [ "${requested_revision}" != "${current_revision}" ]; then
            echo "A newer main revision exists; ${requested_revision} will not replace ${current_revision}."
            echo "deploy=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "deploy=true" >> "${GITHUB_OUTPUT}"

  deploy:
    name: Deploy staging
    needs: resolve-revision
    if: >-
      needs.resolve-revision.outputs.deploy == 'true'
      && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: scaleway-staging
    env:
      SCW_DEFAULT_ORGANIZATION_ID: ${{ vars.SCW_ORGANIZATION_ID }}
      SCW_DEFAULT_PROJECT_ID: ${{ vars.SCW_PROJECT_ID }}
      SCW_DEFAULT_REGION: fr-par
      SCW_DEFAULT_ZONE: fr-par-1
      TRACE_SAMPLING_RATIO_OVERRIDE: ${{ inputs.full_trace_debugging && '1' || '' }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      TF_VAR_bucket_suffix: ${{ vars.BUCKET_SUFFIX }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      TF_VAR_deployer_application_id: ${{ vars.SCW_DEPLOYER_APPLICATION_ID }}
      TF_VAR_project_id: ${{ vars.SCW_PROJECT_ID }}
      TF_VAR_production_deployer_application_id: ${{ vars.SCW_PRODUCTION_DEPLOYER_APPLICATION_ID }}
      TF_VAR_runtime_database_password_version: ${{ vars.RUNTIME_DATABASE_PASSWORD_VERSION }}
      TF_VAR_schema_database_password_version: ${{ vars.SCHEMA_DATABASE_PASSWORD_VERSION }}
      TF_VAR_tem_project_id: ${{ vars.SCW_TEM_PROJECT_ID }}
      TF_VAR_web_application_id: ${{ vars.SCW_WEB_APPLICATION_ID }}
      TF_VAR_worker_application_id: ${{ vars.SCW_WORKER_APPLICATION_ID }}
    steps:
      - name: Validate protected deployment configuration
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.STAGING_TERRAFORM_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STAGING_TERRAFORM_STATE_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FONT_AWESOME_TOKEN: ${{ secrets.FONT_AWESOME_TOKEN }}
          PROTECTED_SECRET_VALUES: ${{ secrets.ROLE_SECRET_VALUES_JSON }}
          RUNTIME_DATABASE_PASSWORD: ${{ secrets.RUNTIME_DATABASE_PASSWORD }}
          SCHEMA_DATABASE_PASSWORD: ${{ secrets.SCHEMA_DATABASE_PASSWORD }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          STAGING_TERRAFORM_STATE_BUCKET: ${{ vars.STAGING_TERRAFORM_STATE_BUCKET }}
        run: |
          for variable_name in \
            AWS_ACCESS_KEY_ID \
            AWS_SECRET_ACCESS_KEY \
            CLOUDFLARE_API_TOKEN \
            FONT_AWESOME_TOKEN \
            PROTECTED_SECRET_VALUES \
            RUNTIME_DATABASE_PASSWORD \
            SCHEMA_DATABASE_PASSWORD \
            SCW_ACCESS_KEY \
            SCW_DEFAULT_ORGANIZATION_ID \
            SCW_DEFAULT_PROJECT_ID \
            SCW_SECRET_KEY \
            STAGING_TERRAFORM_STATE_BUCKET \
            TF_VAR_alert_email \
            TF_VAR_bucket_suffix \
            TF_VAR_cloudflare_zone_id \
            TF_VAR_deployer_application_id \
            TF_VAR_project_id \
            TF_VAR_production_deployer_application_id \
            TF_VAR_runtime_database_password_version \
            TF_VAR_schema_database_password_version \
            TF_VAR_tem_project_id \
            TF_VAR_web_application_id \
            TF_VAR_worker_application_id; do
            if [ -z "${!variable_name}" ]; then
              echo "::error::Missing required protected staging configuration: ${variable_name}"
              exit 1
            fi
          done
          command -v aws >/dev/null
          jq --exit-status 'type == "object"' <<<"${PROTECTED_SECRET_VALUES}" >/dev/null

      - name: Checkout exact release revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-revision.outputs.revision }}

      - name: Require exact-SHA quality and protected baseline
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ops/scaleway/require-release-gates.sh "${{ needs.resolve-revision.outputs.revision }}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Install checksum-verified Scaleway CLI
        run: |
          ops/scaleway/install-cli.sh "${RUNNER_TEMP}/scw"
          echo "SCW_CLI=${RUNNER_TEMP}/scw" >> "${GITHUB_ENV}"

      - name: Initialize remote state
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.STAGING_TERRAFORM_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STAGING_TERRAFORM_STATE_SECRET_ACCESS_KEY }}
          STAGING_TERRAFORM_STATE_BUCKET: ${{ vars.STAGING_TERRAFORM_STATE_BUCKET }}
        run: |
          terraform -chdir=infrastructure/scaleway/staging init \
            -backend-config="bucket=${STAGING_TERRAFORM_STATE_BUCKET}" \
            -input=false \
            -reconfigure

      - name: Login to private Scaleway registry
        env:
          REGISTRY_PASSWORD: ${{ secrets.SCW_SECRET_KEY }}
        run: |
          printf '%s' "${REGISTRY_PASSWORD}" \
            | docker login rg.fr-par.scw.cloud --username nologin --password-stdin

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Reuse an already-built exact-SHA image when available
        id: reuse
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
          METADATA_BUCKET: evorto-staging-deployment-${{ vars.BUCKET_SUFFIX }}
          REVISION: ${{ needs.resolve-revision.outputs.revision }}
        run: |
          mkdir -p deployment
          if aws s3 cp \
            "s3://${METADATA_BUCKET}/deployments/staging/latest.json" \
            deployment/existing.json \
            --endpoint-url https://s3.fr-par.scw.cloud \
            --only-show-errors 2>/dev/null \
            && jq --exit-status \
              --arg revision "${REVISION}" \
              '.status == "succeeded"
                and .environment == "staging"
                and .revision == $revision
                and (.digest | test("^sha256:[0-9a-f]{64}$"))
                and (.schemaHash | test("^[0-9a-f]{64}$"))
                and (.image | startswith("rg.fr-par.scw.cloud/evorto-staging/evorto@sha256:"))' \
              deployment/existing.json >/dev/null; then
            echo "reuse=true" >> "${GITHUB_OUTPUT}"
          else
            rm -f deployment/existing.json
            echo "reuse=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build and push the immutable Linux amd64 image once
        id: build
        if: steps.reuse.outputs.reuse != 'true'
        env:
          FONT_AWESOME_TOKEN: ${{ secrets.FONT_AWESOME_TOKEN }}
          REVISION: ${{ needs.resolve-revision.outputs.revision }}
        run: |
          metadata_file="${RUNNER_TEMP}/staging-build-metadata.json"
          docker buildx build \
            --cache-from type=gha,scope=scaleway-staging \
            --cache-to type=gha,mode=max,scope=scaleway-staging \
            --metadata-file "${metadata_file}" \
            --platform linux/amd64 \
            --provenance=mode=max \
            --push \
            --secret id=FONT_AWESOME_TOKEN,env=FONT_AWESOME_TOKEN \
            --tag "rg.fr-par.scw.cloud/evorto-staging/evorto:sha-${REVISION}" \
            .
          digest="$(
            jq --exit-status --raw-output \
              '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' \
              "${metadata_file}"
          )"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Resolve and verify immutable image metadata
        id: image
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          REUSE: ${{ steps.reuse.outputs.reuse }}
          REVISION: ${{ needs.resolve-revision.outputs.revision }}
        run: |
          if [ "${REUSE}" = "true" ]; then
            image_reference="$(jq --raw-output .image deployment/existing.json)"
            digest="$(jq --raw-output .digest deployment/existing.json)"
            schema_hash="$(jq --raw-output .schemaHash deployment/existing.json)"
            source_maps_key="$(jq --raw-output .sourceMapsKey deployment/existing.json)"
            sbom_key="$(jq --raw-output .sbomKey deployment/existing.json)"
          else
            digest="${BUILD_DIGEST}"
            if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Buildx did not return an immutable image digest"
              exit 1
            fi
            image_reference="rg.fr-par.scw.cloud/evorto-staging/evorto@${digest}"
            digest_key="${digest#sha256:}"
            source_maps_key="source-maps/${REVISION}/${digest_key}.tar.gz"
            sbom_key="sbom/${REVISION}/${digest_key}.spdx.json"
          fi

          docker pull --platform linux/amd64 "${image_reference}"
          bash ops/scaleway/verify-runtime-image.sh "${image_reference}"

          schema_container_id="$(
            docker create \
              --platform linux/amd64 \
              "${image_reference}"
          )"
          packaged_schema_file="${RUNNER_TEMP}/packaged-schema.mjs"
          docker cp \
            "${schema_container_id}:/app/dist/evorto/ops/schema.mjs" \
            "${packaged_schema_file}"
          docker rm "${schema_container_id}" >/dev/null
          packaged_schema_hash="$(
            sha256sum "${packaged_schema_file}" | awk '{print $1}'
          )"
          rm -f "${packaged_schema_file}"
          if [[ ! "${packaged_schema_hash}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Could not hash the packaged Drizzle schema"
            exit 1
          fi
          if [ "${REUSE}" = "true" ] && [ "${packaged_schema_hash}" != "${schema_hash}" ]; then
            echo "::error::Stored manifest schema hash does not match the immutable image"
            exit 1
          fi
          schema_hash="${packaged_schema_hash}"

          {
            echo "digest=${digest}"
            echo "reference=${image_reference}"
            echo "schema_hash=${schema_hash}"
            echo "source_maps_key=${source_maps_key}"
            echo "sbom_key=${sbom_key}"
          } >> "${GITHUB_OUTPUT}"

      - name: Export private source maps from the shared build graph
        if: steps.reuse.outputs.reuse != 'true'
        env:
          FONT_AWESOME_TOKEN: ${{ secrets.FONT_AWESOME_TOKEN }}
        run: |
          mkdir -p source-map-export
          docker buildx build \
            --cache-from type=gha,scope=scaleway-staging \
            --output type=local,dest=source-map-export \
            --platform linux/amd64 \
            --secret id=FONT_AWESOME_TOKEN,env=FONT_AWESOME_TOKEN \
            --target source-maps \
            .
          test -s source-map-export/source-maps.tar.gz

      - name: Generate deployed-image SBOM
        if: steps.reuse.outputs.reuse != 'true'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.image.outputs.reference }}
          syft-version: v1.44.0
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Scan exact deployed image digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.reference }}
          version: v0.70.0
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true

      - name: Verify staging infrastructure has no pending changes
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.STAGING_TERRAFORM_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STAGING_TERRAFORM_STATE_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          TF_VAR_container_image: ${{ steps.image.outputs.reference }}
          TF_VAR_runtime_database_password: ${{ secrets.RUNTIME_DATABASE_PASSWORD }}
          TF_VAR_schema_database_password: ${{ secrets.SCHEMA_DATABASE_PASSWORD }}
        run: |
          set +e
          terraform -chdir=infrastructure/scaleway/staging plan \
            -detailed-exitcode \
            -input=false
          plan_status="$?"
          set -e
          if [ "${plan_status}" -eq 2 ]; then
            echo "::error::Staging infrastructure has pending changes. Apply them explicitly, review the result, then rerun this forward deployment."
            exit 1
          fi
          if [ "${plan_status}" -ne 0 ]; then
            exit "${plan_status}"
          fi
          terraform -chdir=infrastructure/scaleway/staging output -json platform > deployment/platform.json
          terraform -chdir=infrastructure/scaleway/staging output -json database > deployment/database.json

      - name: Reconcile role-scoped Secret Manager values
        env:
          PROTECTED_SECRET_VALUES: ${{ secrets.ROLE_SECRET_VALUES_JSON }}
          RUNTIME_DATABASE_PASSWORD: ${{ secrets.RUNTIME_DATABASE_PASSWORD }}
          SCHEMA_DATABASE_PASSWORD: ${{ secrets.SCHEMA_DATABASE_PASSWORD }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: |
          umask 077
          printf '%s' "${PROTECTED_SECRET_VALUES}" > deployment/protected-secret-values.json
          ops/scaleway/sync-secret-values.sh \
            staging \
            deployment/platform.json \
            deployment/database.json \
            deployment/protected-secret-values.json
          rm -f deployment/protected-secret-values.json deployment/database.json

      - name: Store source maps and SBOM privately
        if: steps.reuse.outputs.reuse != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SBOM_KEY: ${{ steps.image.outputs.sbom_key }}
          SOURCE_MAPS_KEY: ${{ steps.image.outputs.source_maps_key }}
        run: |
          metadata_bucket="$(jq --raw-output .deployment_metadata_bucket deployment/platform.json)"
          aws s3 cp \
            source-map-export/source-maps.tar.gz \
            "s3://${metadata_bucket}/${SOURCE_MAPS_KEY}" \
            --endpoint-url https://s3.fr-par.scw.cloud \
            --only-show-errors
          aws s3 cp \
            sbom.spdx.json \
            "s3://${metadata_bucket}/${SBOM_KEY}" \
            --endpoint-url https://s3.fr-par.scw.cloud \
            --only-show-errors

      - name: Deploy ops and apply only a stable safe schema plan
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
          REVISION: ${{ needs.resolve-revision.outputs.revision }}
          SCHEMA_HASH: ${{ steps.image.outputs.schema_hash }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: |
          ops_status_file="${RUNNER_TEMP}/ops-deployment-status"
          ops/scaleway/deploy-role.sh \
            deployment/platform.json ops \
            "${IMAGE_REFERENCE}" "${REVISION}" "${DIGEST}" "${SCHEMA_HASH}" \
            "${ops_status_file}"

          if [ "$(<"${ops_status_file}")" != "true" ]; then
            echo "Ops already matches the desired release; skipping schema reconciliation."
            exit 0
          fi

          explain_response="$(
            ops/scaleway/invoke-private-container.sh \
              deployment/platform.json \
              ops \
              /internal/ops/schema-explain \
              <<<'{}'
          )"
          jq --exit-status \
            --arg schema_hash "${SCHEMA_HASH}" \
            '.safe == true and .schemaHash == $schema_hash' \
            <<<"${explain_response}" >/dev/null
          plan_digest="$(jq --raw-output .digest <<<"${explain_response}")"

          apply_response="$(
            ops/scaleway/invoke-private-container.sh \
              deployment/platform.json \
              ops \
              /internal/ops/schema-apply \
              <<<"$(jq --null-input --compact-output --arg plan_digest "${plan_digest}" '{ planDigest: $plan_digest }')"
          )"
          jq --exit-status \
            --arg plan_digest "${plan_digest}" \
            '.applied == true and .digest == $plan_digest' \
            <<<"${apply_response}" >/dev/null

          initialization_response="$(
            ops/scaleway/invoke-private-container.sh \
              deployment/platform.json \
              ops \
              /internal/ops/seed-staging \
              <<<'{"mode":"initialize-empty"}'
          )"
          jq --exit-status \
            '.initialized == true' \
            <<<"${initialization_response}" >/dev/null

      - name: Deploy worker and web at the same digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
          REVISION: ${{ needs.resolve-revision.outputs.revision }}
          SCHEMA_HASH: ${{ steps.image.outputs.schema_hash }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: |
          ops/scaleway/deploy-role.sh \
            deployment/platform.json worker \
            "${IMAGE_REFERENCE}" "${REVISION}" "${DIGEST}" "${SCHEMA_HASH}"
          ops/scaleway/deploy-role.sh \
            deployment/platform.json web \
            "${IMAGE_REFERENCE}" "${REVISION}" "${DIGEST}" "${SCHEMA_HASH}"

      - name: Verify staging revision, readiness, tenancy, Auth0, RPC, and noindex
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          REVISION: ${{ needs.resolve-revision.outputs.revision }}
        run: |
          curl_args=(--connect-timeout 5 --max-time 20 --silent --show-error)

          health_body="$(curl "${curl_args[@]}" --fail https://staging.evorto.app/healthz)"
          jq --exit-status '.status == "ok"' <<<"${health_body}" >/dev/null

          ready_status="$(curl "${curl_args[@]}" --output /dev/null --write-out '%{http_code}' https://staging.evorto.app/readyz)"
          test "${ready_status}" = "204"

          version_body="$(curl "${curl_args[@]}" --fail https://staging.evorto.app/version)"
          jq --exit-status \
            --arg revision "${REVISION}" \
            --arg digest "${DIGEST}" \
            '.environment == "staging" and .revision == $revision and .imageDigest == $digest' \
            <<<"${version_body}" >/dev/null

          curl "${curl_args[@]}" --fail \
            --dump-header deployment/events.headers \
            --header 'X-Forwarded-Host: attacker.invalid' \
            --output deployment/events.html \
            https://staging.evorto.app/events
          grep --ignore-case --quiet '^x-robots-tag: noindex, nofollow' deployment/events.headers
          grep --quiet '<app-root' deployment/events.html

          login_status="$(curl "${curl_args[@]}" --output /dev/null --write-out '%{http_code}' https://staging.evorto.app/login)"
          [[ "${login_status}" =~ ^30[12378]$ ]]

          rpc_body="$(
            curl "${curl_args[@]}" \
              --fail \
              --header 'Content-Type: application/json' \
              --data '{"_tag":"Request","id":"1","tag":"config.isAuthenticated","payload":null,"headers":[]}' \
              https://staging.evorto.app/rpc
          )"
          jq --exit-status \
            'type == "array"
              and length == 1
              and .[0]._tag == "Exit"
              and .[0].requestId == "1"
              and .[0].exit._tag == "Success"
              and .[0].exit.value == false' \
            <<<"${rpc_body}" >/dev/null

          generated_endpoint="$(jq --raw-output .containers.web.endpoint deployment/platform.json)"
          generated_status="$(curl "${curl_args[@]}" --output /dev/null --write-out '%{http_code}' "${generated_endpoint}")"
          test "${generated_status}" = "404"

      - name: Write append-only successful deployment manifest
        id: manifest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
          DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
          REVISION: ${{ needs.resolve-revision.outputs.revision }}
          SBOM_KEY: ${{ steps.image.outputs.sbom_key }}
          SCHEMA_HASH: ${{ steps.image.outputs.schema_hash }}
          SOURCE_MAPS_KEY: ${{ steps.image.outputs.source_maps_key }}
        run: |
          timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          manifest_key="deployments/staging/${REVISION}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          jq --null-input \
            --arg digest "${DIGEST}" \
            --arg environment staging \
            --arg image "${IMAGE_REFERENCE}" \
            --arg revision "${REVISION}" \
            --arg sbom_key "${SBOM_KEY}" \
            --arg schema_hash "${SCHEMA_HASH}" \
            --arg source_maps_key "${SOURCE_MAPS_KEY}" \
            --arg timestamp "${timestamp}" \
            --arg workflow "${GITHUB_WORKFLOW}" \
            --arg workflow_run_id "${GITHUB_RUN_ID}" \
            --arg workflow_run_attempt "${GITHUB_RUN_ATTEMPT}" \
            '{
              status: "succeeded",
              environment: $environment,
              revision: $revision,
              image: $image,
              digest: $digest,
              schemaHash: $schema_hash,
              sourceMapsKey: $source_maps_key,
              sbomKey: $sbom_key,
              workflow: $workflow,
              workflowRunId: $workflow_run_id,
              workflowRunAttempt: $workflow_run_attempt,
              timestamp: $timestamp
            }' > deployment/manifest.json

          metadata_bucket="$(jq --raw-output .deployment_metadata_bucket deployment/platform.json)"
          aws s3api put-object \
            --bucket "${metadata_bucket}" \
            --key "${manifest_key}" \
            --body deployment/manifest.json \
            --endpoint-url https://s3.fr-par.scw.cloud \
            --if-none-match '*' \
            >/dev/null
          aws s3api put-object \
            --bucket "${metadata_bucket}" \
            --key deployments/staging/latest.json \
            --body deployment/manifest.json \
            --endpoint-url https://s3.fr-par.scw.cloud \
            >/dev/null
          echo "key=${manifest_key}" >> "${GITHUB_OUTPUT}"

      - name: Upload deployment evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scaleway-staging-${{ needs.resolve-revision.outputs.revision }}
          path: deployment/manifest.json
          if-no-files-found: error
          retention-days: 90
